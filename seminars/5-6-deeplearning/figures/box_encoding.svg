<svg xmlns='http://www.w3.org/2000/svg' width='1060' height='350' viewBox='0 0 1060 350'><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#222222'/></marker></defs><rect width='100%' height='100%' fill='white'/><rect x='100.0' y='40.0' width='200.0' height='200.0' rx='0' fill='none' fill-opacity='1' stroke='#E69F00' stroke-width='2.5' stroke-dasharray='8,5'/>
<rect x='145.0' y='20.0' width='250.0' height='150.0' rx='0' fill='none' fill-opacity='1' stroke='#0072B2' stroke-width='2.5'/>
<text x='108.0' y='230.0' font-size='15' text-anchor='start' fill='#E69F00' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>anchor a</text>
<text x='387.0' y='42.0' font-size='15' text-anchor='end' fill='#0072B2' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>GT b</text>
<circle cx='200.0' cy='140.0' r='5' fill='#E69F00' stroke='#E69F00' stroke-width='1.5'/>
<circle cx='270.0' cy='95.0' r='5' fill='#0072B2' stroke='#0072B2' stroke-width='1.5'/>
<text x='190.0' y='162.0' font-size='13' text-anchor='end' fill='#E69F00' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>(x_a, y_a)</text>
<text x='280.0' y='85.0' font-size='13' text-anchor='start' fill='#0072B2' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>(x, y)</text>
<line x1='200.0' y1='140.0' x2='266.0' y2='140.0' stroke='#222222' stroke-width='1.8' stroke-opacity='1' marker-end='url(#arrow)'/>
<line x1='270.0' y1='140.0' x2='270.0' y2='102.0' stroke='#222222' stroke-width='1.8' stroke-opacity='1' marker-end='url(#arrow)'/>
<text x='235.0' y='162.0' font-size='14' text-anchor='middle' fill='#222222' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>t_x · w_a</text>
<text x='278.0' y='129.5' font-size='14' text-anchor='start' fill='#222222' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>t_y · h_a</text>
<line x1='100.0' y1='270.0' x2='300.0' y2='270.0' stroke='#E69F00' stroke-width='1.5' stroke-opacity='1'/>
<line x1='100.0' y1='264.0' x2='100.0' y2='276.0' stroke='#E69F00' stroke-width='1.5' stroke-opacity='1'/>
<line x1='300.0' y1='264.0' x2='300.0' y2='276.0' stroke='#E69F00' stroke-width='1.5' stroke-opacity='1'/>
<text x='200.0' y='292.0' font-size='14' text-anchor='middle' fill='#E69F00' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>w_a</text>
<line x1='145.0' y1='305.0' x2='395.0' y2='305.0' stroke='#0072B2' stroke-width='1.5' stroke-opacity='1'/>
<line x1='145.0' y1='299.0' x2='145.0' y2='311.0' stroke='#0072B2' stroke-width='1.5' stroke-opacity='1'/>
<line x1='395.0' y1='299.0' x2='395.0' y2='311.0' stroke='#0072B2' stroke-width='1.5' stroke-opacity='1'/>
<text x='405.0' y='310.0' font-size='14' text-anchor='start' fill='#0072B2' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>w = w_a · exp(t_w)</text>
<text x='650.0' y='50.0' font-size='16' text-anchor='start' fill='#222222' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>encode:  b, a  →  t</text>
<text x='670.0' y='82.0' font-size='15' text-anchor='start' fill='#222222' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>t_x = (x − x_a) / w_a</text>
<text x='670.0' y='108.0' font-size='15' text-anchor='start' fill='#222222' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>t_y = (y − y_a) / h_a</text>
<text x='670.0' y='134.0' font-size='15' text-anchor='start' fill='#222222' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>t_w = log(w / w_a)</text>
<text x='670.0' y='160.0' font-size='15' text-anchor='start' fill='#222222' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>t_h = log(h / h_a)</text>
<text x='650.0' y='210.0' font-size='16' text-anchor='start' fill='#222222' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>decode:  t, a  →  b</text>
<text x='670.0' y='242.0' font-size='15' text-anchor='start' fill='#222222' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>x = x_a + t_x · w_a</text>
<text x='670.0' y='268.0' font-size='15' text-anchor='start' fill='#222222' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>w = w_a · exp(t_w)</text>
<text x='650.0' y='315.0' font-size='14' text-anchor='start' fill='#555555' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>сеть предсказывает t, а не координаты b</text></svg>